spring.application.name=rental-management
server.port=8080

spring.profiles.active=${ENV}

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging
logging.level.com.rental=INFO
logging.level.org.hibernate.SQL=DEBUG

# Email Configuration (used for certificate expiry reminders)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:rentalmanagementglasgow}
spring.mail.password=${MAIL_PASSWORD:tdryijchdzvcfzmo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

landlord.email=${LANDLORD_EMAIL:ganeshprasad.iit@gmail.com}
landlord.name=${LANDLORD_NAME:Property Manager}
notification.enabled=${NOTIFICATIONS_ENABLED:true}

# Cloudflare R2 Configuration (S3-compatible object storage for certificates)
r2.access.key=${R2_ACCESS_KEY:}
r2.secret.key=${R2_SECRET_KEY:}
r2.endpoint=${R2_ENDPOINT:}
r2.bucket.name=${R2_BUCKET_NAME:rental-certificates}

# File upload limits (certificates are typically small PDFs, 10MB is generous headroom)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB